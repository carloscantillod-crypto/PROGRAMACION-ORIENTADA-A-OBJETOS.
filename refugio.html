<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refugio de Mascotas - Sistema Integrado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Barra de Navegación -->
    <nav class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="font-bold text-xl flex items-center gap-2">
                <i class="fas fa-paw"></i> Refugio Patitas
            </div>
            <div class="space-x-2">
                <button onclick="cambiarVista('publica')" id="btn-publica" class="px-4 py-2 bg-indigo-800 rounded-md font-medium transition hover:bg-indigo-700">Vista Pública</button>
                <button onclick="cambiarVista('admin')" id="btn-admin" class="px-4 py-2 bg-indigo-500 rounded-md font-medium transition hover:bg-indigo-700">Panel Administrador</button>
            </div>
        </div>
    </nav>

    <!-- Notificaciones flotantes -->
    <div id="notificacion" class="fixed top-20 right-5 max-w-sm w-full bg-green-500 text-white px-4 py-3 rounded shadow-lg transform transition-all duration-300 translate-x-full opacity-0 z-50 flex items-center gap-3">
        <i id="notificacion-icono" class="fas fa-check-circle text-xl"></i>
        <span id="notificacion-texto" class="font-medium">Mensaje</span>
    </div>

    <!-- VISTA PÚBLICA (ADOPCIONES) -->
    <div id="vista-publica" class="max-w-6xl mx-auto p-6 block">
        <div class="grid md:grid-cols-3 gap-6">
            
            <!-- Lista de Mascotas Disponibles -->
            <div class="md:col-span-2">
                <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-indigo-200 pb-2">Mascotas buscando hogar</h2>
                <div id="lista-mascotas-disponibles" class="grid sm:grid-cols-2 gap-4">
                    <!-- Las mascotas se insertan aquí vía JavaScript -->
                </div>
            </div>

            <!-- Formulario de Adopción -->
            <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200 h-fit">
                <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <i class="fas fa-heart text-red-500"></i> Formulario de Adopción
                </h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Mascota a adoptar</label>
                        <select id="select-mascota" class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                            <!-- Opciones se llenan con JS -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Documento de Identidad</label>
                        <input type="text" id="doc-adoptante" placeholder="Ej: 123456789" class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
                        <input type="text" id="nom-adoptante" placeholder="Ej: Juan Pérez" class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <button onclick="procesarAdopcion()" class="w-full bg-green-500 text-white font-bold py-2 px-4 rounded hover:bg-green-600 transition flex justify-center items-center gap-2">
                        <i class="fas fa-home"></i> Procesar Adopción
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- VISTA ADMINISTRADOR -->
    <div id="vista-admin" class="max-w-6xl mx-auto p-6 hidden">
        <div class="grid md:grid-cols-3 gap-6">
            
            <!-- Formulario Agregar Mascota -->
            <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200 h-fit">
                <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <i class="fas fa-plus-circle text-indigo-500"></i> Ingresar Nueva Mascota
                </h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Animal</label>
                        <select id="nuevo-tipo" onchange="cambiarAtributoEspecial()" class="w-full border border-gray-300 rounded px-3 py-2">
                            <option value="Perro">Perro</option>
                            <option value="Gato">Gato</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                        <input type="text" id="nuevo-nombre" class="w-full border border-gray-300 rounded px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Edad (Años)</label>
                        <input type="number" id="nueva-edad" min="0" class="w-full border border-gray-300 rounded px-3 py-2">
                    </div>
                    <!-- Campo dinámico (Raza para perro, Esterilizado para gato) -->
                    <div id="contenedor-atributo-especial">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Raza</label>
                        <input type="text" id="nuevo-atributo" class="w-full border border-gray-300 rounded px-3 py-2">
                    </div>

                    <button onclick="agregarMascota()" class="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded hover:bg-indigo-700 transition">
                        Guardar Mascota
                    </button>
                </div>
            </div>

            <!-- Tablas de Administración -->
            <div class="md:col-span-2 space-y-6">
                <!-- Historial de Adopciones -->
                <div class="bg-white rounded-lg shadow-md overflow-hidden">
                    <div class="bg-green-600 px-4 py-3 text-white font-bold flex justify-between items-center">
                        <span><i class="fas fa-book mr-2"></i> Historial de Adopciones</span>
                        <span id="contador-adopciones" class="bg-white text-green-600 px-2 py-1 rounded text-xs">0</span>
                    </div>
                    <div class="p-0 overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-100 text-gray-600 text-sm">
                                    <th class="p-3 border-b">ID Mascota</th>
                                    <th class="p-3 border-b">Mascota</th>
                                    <th class="p-3 border-b">Adoptante</th>
                                    <th class="p-3 border-b">Doc. Adoptante</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-adopciones" class="text-sm">
                                <!-- Filas JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Inventario Completo -->
                <div class="bg-white rounded-lg shadow-md overflow-hidden">
                    <div class="bg-gray-700 px-4 py-3 text-white font-bold">
                        <i class="fas fa-boxes mr-2"></i> Inventario Completo (Todas las mascotas)
                    </div>
                    <div class="p-0 overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-100 text-gray-600 text-sm">
                                    <th class="p-3 border-b">ID</th>
                                    <th class="p-3 border-b">Tipo</th>
                                    <th class="p-3 border-b">Nombre</th>
                                    <th class="p-3 border-b">Estado</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-inventario" class="text-sm">
                                <!-- Filas JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS CON HERENCIA DE CLASES EN POO -->
    <script>
        // =========================================================
        // IMPLEMENTACIÓN DE CLASES Y HERENCIA
        // =========================================================

        // Clase Padre / Base
        class Mascota {
            constructor(id, tipo, nombre, edad) {
                this.id = id;
                this.tipo = tipo;
                this.nombre = nombre;
                this.edad = edad;
                this.adoptado = false;
            }

            // Método polimórfico a ser sobreescrito por subclases
            getDetalle() {
                return "Sin detalle";
            }

            // Método para obtener el icono según el tipo
            getIconoHTML() {
                return '<i class="fas fa-paw text-indigo-500"></i>';
            }
        }

        // Subclase Perro (Hereda de Mascota)
        class Perro extends Mascota {
            constructor(id, nombre, edad, raza) {
                super(id, "Perro", nombre, edad); // Llamada al constructor padre
                this.raza = raza;
            }

            // Sobreescritura de método (Polimorfismo)
            getDetalle() {
                return `Raza: ${this.raza}`;
            }

            getIconoHTML() {
                return '<i class="fas fa-dog text-indigo-500"></i>';
            }
        }

        // Subclase Gato (Hereda de Mascota)
        class Gato extends Mascota {
            constructor(id, nombre, edad, esterilizado) {
                super(id, "Gato", nombre, edad); // Llamada al constructor padre
                this.esterilizado = esterilizado;
            }

            // Sobreescritura de método (Polimorfismo)
            getDetalle() {
                return `Esterilizado: ${this.esterilizado}`;
            }

            getIconoHTML() {
                return '<i class="fas fa-cat text-orange-500"></i>';
            }
        }

        // =========================================================
        // LÓGICA DE LA APLICACIÓN
        // =========================================================

        let contadorID = 3;
        
        // Instanciación de objetos usando las clases derivadas
        let inventario = [
            new Perro("P01", "Max", 3, "Labrador"),
            new Gato("G01", "Michi", 2, "Sí"),
            new Perro("P02", "Rocky", 5, "Pastor Alemán")
        ];

        let registroAdopciones = [];

        function cambiarVista(vista) {
            const vPublica = document.getElementById('vista-publica');
            const vAdmin = document.getElementById('vista-admin');
            const btnPublica = document.getElementById('btn-publica');
            const btnAdmin = document.getElementById('btn-admin');

            if (vista === 'publica') {
                vPublica.classList.remove('hidden');
                vAdmin.classList.add('hidden');
                btnPublica.classList.replace('bg-indigo-500', 'bg-indigo-800');
                btnAdmin.classList.replace('bg-indigo-800', 'bg-indigo-500');
            } else {
                vPublica.classList.add('hidden');
                vAdmin.classList.remove('hidden');
                btnAdmin.classList.replace('bg-indigo-500', 'bg-indigo-800');
                btnPublica.classList.replace('bg-indigo-800', 'bg-indigo-500');
            }
        }

        function actualizarUI() {
            const contenedorCards = document.getElementById('lista-mascotas-disponibles');
            const selectAdopcion = document.getElementById('select-mascota');
            const tablaInventario = document.getElementById('tabla-inventario');
            const tablaAdopciones = document.getElementById('tabla-adopciones');
            
            contenedorCards.innerHTML = '';
            selectAdopcion.innerHTML = '<option value="">-- Seleccione una mascota --</option>';
            tablaInventario.innerHTML = '';
            tablaAdopciones.innerHTML = '';

            let mascotasDisponibles = 0;

            inventario.forEach(m => {
                // Hacemos uso del polimorfismo con m.getIconoHTML() y m.getDetalle()
                if (!m.adoptado) {
                    mascotasDisponibles++;
                    contenedorCards.innerHTML += `
                        <div class="bg-white rounded-lg p-4 shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-md transition">
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <h4 class="font-bold text-lg">${m.getIconoHTML()} ${m.nombre}</h4>
                                    <span class="bg-indigo-100 text-indigo-800 text-xs px-2 py-1 rounded font-bold">${m.id}</span>
                                </div>
                                <p class="text-sm text-gray-600 mb-1"><b>Edad:</b> ${m.edad} años</p>
                                <p class="text-sm text-gray-600"><b>Detalle:</b> ${m.getDetalle()}</p>
                            </div>
                        </div>
                    `;
                    selectAdopcion.innerHTML += `<option value="${m.id}">${m.id} - ${m.nombre} (${m.tipo})</option>`;
                }

                const estado = m.adoptado 
                    ? '<span class="text-green-600 font-bold text-xs bg-green-100 px-2 py-1 rounded">Adoptado</span>' 
                    : '<span class="text-indigo-600 font-bold text-xs bg-indigo-100 px-2 py-1 rounded">Disponible</span>';
                
                tablaInventario.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3 font-medium">${m.id}</td>
                        <td class="p-3">${m.tipo}</td>
                        <td class="p-3">${m.nombre}</td>
                        <td class="p-3">${estado}</td>
                    </tr>
                `;
            });

            if (mascotasDisponibles === 0) {
                contenedorCards.innerHTML = '<div class="col-span-2 text-center py-8 text-gray-500 font-medium">No hay mascotas disponibles en este momento.</div>';
            }

            if (registroAdopciones.length === 0) {
                tablaAdopciones.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Aún no hay adopciones registradas.</td></tr>';
            } else {
                registroAdopciones.forEach(adop => {
                    tablaAdopciones.innerHTML += `
                        <tr class="border-b hover:bg-green-50">
                            <td class="p-3 font-bold text-gray-700">${adop.mascotaId}</td>
                            <td class="p-3">${adop.mascotaNombre}</td>
                            <td class="p-3 font-medium">${adop.adoptanteNombre}</td>
                            <td class="p-3 text-gray-600">${adop.adoptanteDoc}</td>
                        </tr>
                    `;
                });
            }
            
            document.getElementById('contador-adopciones').innerText = registroAdopciones.length;
        }

        function cambiarAtributoEspecial() {
            const tipo = document.getElementById('nuevo-tipo').value;
            const contenedor = document.getElementById('contenedor-atributo-especial');
            
            if (tipo === 'Perro') {
                contenedor.innerHTML = `
                    <label class="block text-sm font-medium text-gray-700 mb-1">Raza</label>
                    <input type="text" id="nuevo-atributo" placeholder="Ej: Poodle, Labrador..." class="w-full border border-gray-300 rounded px-3 py-2">
                `;
            } else {
                contenedor.innerHTML = `
                    <label class="block text-sm font-medium text-gray-700 mb-1">¿Esterilizado?</label>
                    <select id="nuevo-atributo" class="w-full border border-gray-300 rounded px-3 py-2">
                        <option value="Sí">Sí</option>
                        <option value="No">No</option>
                    </select>
                `;
            }
        }

        function agregarMascota() {
            const tipo = document.getElementById('nuevo-tipo').value;
            const nombre = document.getElementById('nuevo-nombre').value.trim();
            const edad = document.getElementById('nueva-edad').value;
            const atributo = document.getElementById('nuevo-atributo').value.trim();

            if (!nombre || !edad || !atributo) {
                mostrarNotificacion("Completa todos los campos para registrar la mascota", "error");
                return;
            }

            contadorID++;
            const letra = tipo === 'Perro' ? 'P' : 'G';
            const nuevoId = letra + contadorID.toString().padStart(2, '0');

            // Instanciación dinámica aprovechando la herencia
            let nuevaMascota;
            if (tipo === 'Perro') {
                nuevaMascota = new Perro(nuevoId, nombre, parseInt(edad), atributo);
            } else {
                nuevaMascota = new Gato(nuevoId, nombre, parseInt(edad), atributo);
            }

            inventario.push(nuevaMascota);

            document.getElementById('nuevo-nombre').value = '';
            document.getElementById('nueva-edad').value = '';
            if(tipo === 'Perro') document.getElementById('nuevo-atributo').value = '';
            
            actualizarUI();
            mostrarNotificacion(`Mascota ${nombre} agregada correctamente (${nuevoId})`, "exito");
        }

        function procesarAdopcion() {
            const idMascota = document.getElementById('select-mascota').value;
            const doc = document.getElementById('doc-adoptante').value.trim();
            const nombre = document.getElementById('nom-adoptante').value.trim();

            if (!idMascota) {
                mostrarNotificacion("Selecciona una mascota de la lista.", "error"); return;
            }
            if (!doc || !nombre) {
                mostrarNotificacion("Debes ingresar documento y nombre.", "error"); return;
            }

            const mascota = inventario.find(m => m.id === idMascota);

            if (mascota) {
                mascota.adoptado = true;
                
                registroAdopciones.push({
                    mascotaId: mascota.id,
                    mascotaNombre: mascota.nombre,
                    adoptanteDoc: doc,
                    adoptanteNombre: nombre
                });

                document.getElementById('doc-adoptante').value = '';
                document.getElementById('nom-adoptante').value = '';
                
                actualizarUI();
                mostrarNotificacion(`¡Felicidades ${nombre}! Has adoptado a ${mascota.nombre}.`, "exito");
            }
        }

        function mostrarNotificacion(mensaje, tipo) {
            const toast = document.getElementById('notificacion');
            const texto = document.getElementById('notificacion-texto');
            const icono = document.getElementById('notificacion-icono');

            texto.innerText = mensaje;
            
            if (tipo === "error") {
                toast.classList.remove('bg-green-500');
                toast.classList.add('bg-red-500');
                icono.className = "fas fa-exclamation-triangle text-xl";
            } else {
                toast.classList.remove('bg-red-500');
                toast.classList.add('bg-green-500');
                icono.className = "fas fa-check-circle text-xl";
            }

            toast.classList.remove('translate-x-full', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
            }, 3500);
        }

        window.onload = actualizarUI;
    </script>
</body>
</html>
